# Render's free plan puts the API to sleep after 15 minutes without requests, and the first
# request after that takes about a minute. Pinging it every 10 minutes keeps it awake.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://eventwall-api.onrender.com/api/health
